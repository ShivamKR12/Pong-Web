name: pygbag_build

on:
  push:
    branches:
      - web
    paths-ignore:
      - "README.md"
      - "favicons/**"
      - ".gitignore"
      - ".LICENSE"
      - "pygbag-README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pygbag:
    name: Build for Emscripten pygbag runtime
    if: github.event_name != 'push' || (!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]'))

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Checkout
      run: |
            python -m pip install pygbag
            python -m pygbag --build $GITHUB_WORKSPACE/main.py

    - name : "Upload to GitHub pages branch gh-pages"
      uses: JamesIves/github-pages-deploy-action@4.1.7
      with:
        branch: gh-pages
        folder: build/web
